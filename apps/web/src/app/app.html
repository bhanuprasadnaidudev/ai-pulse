<div class="shell">
  <aside class="sidebar" [class.collapsed]="collapsed()">
    <div class="sidebar-header">
      @if (!collapsed()) {
        <h1 class="logo">AI <span class="accent">PULSE</span></h1>
      } @else {
        <h1 class="logo"><span class="accent">AI</span></h1>
      }
      <button
        class="collapse-toggle"
        (click)="toggleSidebar()"
        [attr.aria-label]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
      >
        {{ collapsed() ? '»' : '«' }}
      </button>
    </div>

    <nav class="nav-list">
      <ui-nav-item layout="row" [active]="true">
        <span class="nav-icon">🏠</span>
        @if (!collapsed()) {
          <span>Feed</span>
        }
      </ui-nav-item>
      <ui-nav-item layout="row" [disabled]="true">
        <span class="nav-icon">📖</span>
        @if (!collapsed()) {
          <span>Learn</span>
        }
      </ui-nav-item>
      <ui-nav-item layout="row" [disabled]="true">
        <span class="nav-icon">⚡</span>
        @if (!collapsed()) {
          <span>Agents</span>
        }
      </ui-nav-item>
      <ui-nav-item layout="row" [disabled]="true">
        <span class="nav-icon">👤</span>
        @if (!collapsed()) {
          <span>You</span>
        }
      </ui-nav-item>
    </nav>
  </aside>

  <main class="content">
    <app-feed />
  </main>

  <ui-fab class="chat-fab">💬</ui-fab>
</div>

<router-outlet />
