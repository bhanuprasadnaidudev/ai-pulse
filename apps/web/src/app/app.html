<div class="shell">
  <aside class="sidebar" [class.collapsed]="collapsed()">
    <div class="sidebar-header">
      <h1 class="logo">
        <span class="accent logo-full">Current</span>
      </h1>
      <button
        class="collapse-toggle"
        (click)="toggleSidebar()"
        [attr.aria-label]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
      >
        <svg
          class="toggle-icon"
          [class.flipped]="collapsed()"
          viewBox="0 0 24 24"
          width="14"
          height="14"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M15 6l-6 6 6 6" />
        </svg>
      </button>
    </div>

    <nav class="nav-list">
      <ui-nav-item layout="row" [active]="true">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 11.5 12 4l9 7.5" />
          <path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9" />
        </svg>
        <span class="nav-label">Feed</span>
      </ui-nav-item>
      <ui-nav-item layout="row" [disabled]="true">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z" />
          <path d="M20 5.5c0-.8-.7-1.5-1.5-1.5H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z" />
        </svg>
        <span class="nav-label">Learn</span>
      </ui-nav-item>
      <ui-nav-item layout="row" [disabled]="true">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2 4 14h6l-1 8 9-12h-6z" />
        </svg>
        <span class="nav-label">Agents</span>
      </ui-nav-item>
      <div class="you-wrapper" #youWrapper>
        <ui-nav-item layout="row" [active]="youPanelOpen()" (click)="toggleYouPanel()">
          @if (currentUser(); as user) {
            @if (user.picture) {
              <img class="nav-avatar" [src]="user.picture" [alt]="user.name" />
            } @else {
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8" r="4" />
                <path d="M4 20c0-4 3.5-7 8-7s8 3 8 7" />
              </svg>
            }
          } @else {
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="4" />
              <path d="M4 20c0-4 3.5-7 8-7s8 3 8 7" />
            </svg>
          }
          <span class="nav-label">{{ currentUser()?.name ?? 'You' }}</span>
        </ui-nav-item>

        @if (youPanelOpen()) {
          <div class="you-panel">
            @if (currentUser(); as user) {
              <div class="you-profile">
                @if (user.picture) {
                  <img class="you-avatar" [src]="user.picture" [alt]="user.name" />
                }
                <div class="you-profile-text">
                  <span class="you-name">{{ user.name }}</span>
                  <span class="you-email">{{ user.email }}</span>
                </div>
              </div>
              <button class="you-signout" (click)="signOut()">Sign out</button>
            } @else {
              <span class="you-panel-label">Sign in to Current</span>
              <div #googleButtonContainer></div>
            }
          </div>
        }
      </div>
    </nav>

    <div class="sidebar-bottom">
      <span class="section-label">Layout</span>
      <div class="layout-switch" role="group" aria-label="Feed layout">
        <button
          type="button"
          [class.active]="layoutMode() === 'grid'"
          (click)="setLayout('grid')"
          title="Grid"
          aria-label="Grid layout"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3.5" y="3.5" width="7" height="7" rx="1" />
            <rect x="13.5" y="3.5" width="7" height="7" rx="1" />
            <rect x="3.5" y="13.5" width="7" height="7" rx="1" />
            <rect x="13.5" y="13.5" width="7" height="7" rx="1" />
          </svg>
        </button>
        <button
          type="button"
          [class.active]="layoutMode() === 'continuous'"
          (click)="setLayout('continuous')"
          title="Continuous scroll"
          aria-label="Continuous scroll layout"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <line x1="4" y1="6" x2="20" y2="6" />
            <line x1="4" y1="12" x2="20" y2="12" />
            <line x1="4" y1="18" x2="20" y2="18" />
          </svg>
        </button>
        <button
          type="button"
          [class.active]="layoutMode() === 'focus'"
          (click)="setLayout('focus')"
          title="One at a time"
          aria-label="One at a time layout"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="6" y="4" width="12" height="16" rx="1" />
          </svg>
        </button>
      </div>
    </div>
  </aside>

  <main class="content">
    <app-feed />
  </main>

  <ui-fab class="chat-fab">💬</ui-fab>
</div>

<router-outlet />
