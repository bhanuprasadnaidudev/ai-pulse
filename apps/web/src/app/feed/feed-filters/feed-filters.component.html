<div class="filters-bar">
  <div class="toolbar-row">
    <button
      class="icon-btn"
      [class.active]="activeSources.length > 0"
      (click)="toggleFilterPanel()"
      [attr.aria-label]="filterPanelOpen() ? 'Close source filter' : 'Filter by source'"
    >
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 5h16l-6.5 7.5V19l-3 1.5v-8z" />
      </svg>
      @if (activeSources.length > 0) {
        <span class="count-badge">{{ activeSources.length }}</span>
      }
    </button>

    <div class="spacer"></div>

    <button
      class="icon-btn"
      (click)="toggleSearch()"
      [attr.aria-label]="searchOpen() ? 'Close search' : 'Open search'"
    >
      @if (!searchOpen()) {
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7" />
          <path d="m21 21-4.3-4.3" />
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      }
    </button>

    <input
      type="date"
      class="date-input"
      [value]="activeDate ?? ''"
      (change)="onDateInput($any($event.target).value)"
      aria-label="Jump to date"
    />
  </div>

  @if (filterPanelOpen()) {
    <div class="filter-panel">
      <div class="filter-panel-header">
        <span>Sources</span>
        <button class="text-btn" (click)="clearSources()">Clear</button>
      </div>
      @for (s of sources; track s) {
        <label class="checkbox-row">
          <input type="checkbox" [checked]="isSourceChecked(s)" (change)="toggleSource(s)" />
          <span>{{ s }}</span>
        </label>
      }
    </div>
  }

  @if (searchOpen()) {
    <div class="search-panel">
      <input
        type="text"
        class="search-input"
        placeholder="Search AI Pulse — press Enter"
        [(ngModel)]="searchText"
        (keydown)="onSearchKeydown($event)"
        #searchBox
      />

      @if (trending.length > 0) {
        <div class="trending">
          <span class="trending-label">🔥 Trending this week</span>
          <div class="trending-chips">
            @for (item of trending; track item.id) {
              <button class="trending-chip" (click)="pickTrending(item)">{{ item.title }}</button>
            }
          </div>
        </div>
      }
    </div>
  }
</div>
