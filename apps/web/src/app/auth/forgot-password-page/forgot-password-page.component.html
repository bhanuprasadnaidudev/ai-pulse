<div class="auth-page">
  <div class="auth-card">
    <h1 class="auth-logo">Current</h1>

    @if (sent()) {
      <h2 class="auth-title">Check your email</h2>
      <p class="auth-intro">
        If an account exists for <strong>{{ email }}</strong>, a reset link is on its way.
        The link works once and expires in an hour.
      </p>
      <p class="auth-switch"><a routerLink="/login">Back to log in</a></p>
    } @else {
      <h2 class="auth-title">Reset password</h2>
      <p class="auth-intro">Enter your email and we'll send you a link to choose a new password.</p>

      <form (ngSubmit)="submit()" #form="ngForm">
        <label class="auth-field">
          <span>Email</span>
          <input type="email" name="email" [(ngModel)]="email" required autocomplete="email" />
        </label>
        <button type="submit" class="auth-submit" [disabled]="form.invalid || submitting()">
          {{ submitting() ? 'Sending...' : 'Send reset link' }}
        </button>
      </form>

      <p class="auth-switch">Remembered it? <a routerLink="/login">Log in</a></p>
    }
  </div>
</div>
