<div class="auth-page">
  <div class="auth-card">
    <h1 class="auth-logo">Current</h1>
    <h2 class="auth-title">Choose a new password</h2>

    @if (errorMessage()) {
      <div class="auth-error">{{ errorMessage() }}</div>
    }

    @if (hasToken) {
      <form (ngSubmit)="submit()" #form="ngForm">
        <label class="auth-field">
          <span>New password</span>
          <input type="password" name="password" [(ngModel)]="password" required autocomplete="new-password" />
          @if (passwordTooShort) {
            <span class="auth-hint">At least 8 characters.</span>
          }
        </label>
        <label class="auth-field">
          <span>Confirm password</span>
          <input type="password" name="confirmPassword" [(ngModel)]="confirmPassword" required autocomplete="new-password" />
          @if (passwordsMismatch) {
            <span class="auth-hint">Passwords don't match.</span>
          }
        </label>
        <button type="submit" class="auth-submit" [disabled]="form.invalid || passwordTooShort || passwordsMismatch || submitting()">
          {{ submitting() ? 'Saving...' : 'Set new password' }}
        </button>
      </form>
    } @else {
      <p class="auth-switch"><a routerLink="/forgot-password">Request a new reset link</a></p>
    }

    <p class="auth-switch"><a routerLink="/login">Back to log in</a></p>
  </div>
</div>
