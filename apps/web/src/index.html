<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Current</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Current — every AI story that matters, from the labs and the industry press, summarised in plain language and updated hourly.">
  <meta name="theme-color" content="#111110">

  <!-- Social preview: without these, a shared link renders as a bare URL. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Current">
  <meta property="og:title" content="Current — AI news, in plain language">
  <meta property="og:description" content="Every AI story that matters, from the labs and the industry press, summarised in plain language and updated hourly.">

  <meta name="twitter:title" content="Current — AI news, in plain language">
  <meta name="twitter:description" content="Every AI story that matters, from the labs and the industry press, summarised in plain language and updated hourly.">

  <!-- The accent dot, inline so it needs no binary asset and stays in sync
       with the in-app mark. Replaces Angular's default favicon. -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
